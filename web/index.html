<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP5录播器</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <nav class="navbar">
            <div class="nav-brand">MP5录播器</div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="files">文件</button>
                <button class="nav-tab" data-tab="record">录制</button>
                <button class="nav-tab" data-tab="settings">设置</button>
            </div>
        </nav>

        <!-- 文件列表页 -->
        <div class="page active" id="page-files">
            <div class="file-list-header">
                <h2>MP5文件</h2>
                <button class="btn btn-primary" id="btn-import-mp5">导入MP5文件</button>
            </div>
            <div class="file-list" id="file-list">
                <div class="empty-state" id="empty-state">
                    <p>暂无MP5文件</p>
                    <p class="hint">录制或导入MP5文件后在此显示</p>
                </div>
            </div>
            <input type="file" id="file-input" accept=".mp5,.mp4" multiple style="display:none"/>
        </div>

        <!-- 录制页 -->
        <div class="page" id="page-record">
            <div class="record-status-bar">
                <span id="gps-accuracy">GPS: --</span>
                <span id="storage-info">存储: --</span>
            </div>
            <div class="record-preview">
                <video id="record-preview-video" autoplay muted playsinline></video>
                <div class="record-overlay">
                    <div class="record-time" id="record-time">00:00:00</div>
                    <div class="record-indicator" id="record-indicator" style="display:none;">REC</div>
                    <div class="gps-info" id="record-gps-info">
                        <div>坐标: --</div>
                        <div>方向: -- 速度: --</div>
                    </div>
                </div>
                <div class="mini-map" id="record-mini-map" style="display:none;"></div>
            </div>
            <div class="record-controls">
                <button class="btn btn-record" id="btn-record">录制</button>
                <button class="btn btn-pause" id="btn-pause" disabled>暂停</button>
                <button class="btn btn-stop" id="btn-stop" disabled>停止</button>
                <button class="btn btn-poi" id="btn-poi" disabled>标记POI</button>
            </div>
        </div>

        <!-- 播放页 -->
        <div class="page" id="page-player">
            <div class="player-header">
                <button class="btn btn-back" id="btn-back">← 返回</button>
                <span class="player-title" id="player-title">文件名.mp5</span>
                <button class="btn btn-more" id="btn-more">⋮</button>
            </div>
            <div class="player-main" id="player-main">
                <div class="video-pane" id="video-pane">
                    <video id="player-video" controls></video>
                </div>
                <div class="map-pane" id="map-pane">
                    <div id="player-map"></div>
                </div>
            </div>
            <div class="player-controls">
                <div class="view-switcher">
                    <button class="btn btn-view active" data-view="split">分屏</button>
                    <button class="btn btn-view" data-view="video">仅视频</button>
                    <button class="btn btn-view" data-view="map">仅地图</button>
                    <button class="btn btn-view" data-view="pip">画中画</button>
                </div>
                <div class="export-bar">
                    <button class="btn btn-export" data-format="mp4">导出MP4</button>
                    <button class="btn btn-export" data-format="gpx">导出GPX</button>
                    <button class="btn btn-export" data-format="geojson">导出GeoJSON</button>
                </div>
            </div>
        </div>

        <!-- 设置页 -->
        <div class="page" id="page-settings">
            <div class="settings-group">
                <h3>视频设置</h3>
                <div class="setting-row">
                    <label>分辨率</label>
                    <select id="setting-resolution">
                        <option value="720p">720p</option>
                        <option value="1080p" selected>1080p</option>
                        <option value="4k">4K</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>帧率</label>
                    <select id="setting-framerate">
                        <option value="24">24fps</option>
                        <option value="30" selected>30fps</option>
                        <option value="60">60fps</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>编码</label>
                    <select id="setting-codec">
                        <option value="h264" selected>H.264</option>
                        <option value="h265">H.265</option>
                    </select>
                </div>
            </div>
            <div class="settings-group">
                <h3>GPS设置</h3>
                <div class="setting-row">
                    <label>GPS采样率</label>
                    <select id="setting-gps-rate">
                        <option value="1" selected>1Hz</option>
                        <option value="5">5Hz</option>
                        <option value="10">10Hz</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>方向采样率</label>
                    <select id="setting-heading-rate">
                        <option value="5">5Hz</option>
                        <option value="10" selected>10Hz</option>
                        <option value="25">25Hz</option>
                    </select>
                </div>
            </div>
            <div class="settings-group">
                <h3>地图设置</h3>
                <div class="setting-row">
                    <label>地图源</label>
                    <select id="setting-map-source">
                        <option value="osm" selected>OpenStreetMap</option>
                        <option value="satellite">卫星图</option>
                        <option value="terrain">地形图</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>默认视图</label>
                    <select id="setting-default-view">
                        <option value="0">仅视频</option>
                        <option value="1">仅地图</option>
                        <option value="2" selected>分屏(左右)</option>
                        <option value="3">分屏(上下)</option>
                        <option value="4">画中画</option>
                    </select>
                </div>
                <div class="setting-row">
                    <label>显示轨迹线</label>
                    <input type="checkbox" id="setting-show-trajectory" checked>
                </div>
                <div class="setting-row">
                    <label>速度热力图</label>
                    <input type="checkbox" id="setting-speed-heatmap" checked>
                </div>
            </div>
        </div>
    </div>

    <!-- POI输入对话框 -->
    <div class="modal" id="poi-modal" style="display:none;">
        <div class="modal-content">
            <h3>添加POI标记</h3>
            <input type="text" id="poi-label" placeholder="标记名称（可选）">
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="poi-cancel">取消</button>
                <button class="btn btn-primary" id="poi-confirm">确认</button>
            </div>
        </div>
    </div>

    <!-- 导出菜单 -->
    <div class="modal" id="more-modal" style="display:none;">
        <div class="modal-content">
            <h3>更多操作</h3>
            <button class="btn btn-secondary" id="more-export-mp4">导出MP4（去除GPS）</button>
            <button class="btn btn-secondary" id="more-export-gpx">导出GPX轨迹</button>
            <button class="btn btn-secondary" id="more-export-geojson">导出GeoJSON</button>
            <button class="btn btn-secondary" id="more-screenshot">截图</button>
            <button class="btn btn-secondary" id="more-share">分享</button>
            <button class="btn btn-secondary" id="more-close">关闭</button>
        </div>
    </div>

    <!-- Toast消息 -->
    <div class="toast" id="toast" style="display:none;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/mp5-box.js"></script>
    <script src="js/mp5-parser.js"></script>
    <script src="js/mp5-muxer.js"></script>
    <script src="js/sync-engine.js"></script>
    <script src="js/recorder.js"></script>
    <script src="js/player.js"></script>
    <script src="js/file-manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
